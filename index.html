<style>
  :root{
    --paper:#fbfbfa;
    --ink:#141414;
    --rule:#141414;
    --muted:#5d5f58;
    --sage:#eaf1df;
    --sage-deep:#c9ddaa;
    --blush:#f5dede;
    --mark:#00a6e0;
    --mono: ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans: "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);
    display:flex;flex-direction:column;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- top bar ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:9px 14px;border-bottom:1px solid var(--rule);
    background:var(--paper);flex-wrap:wrap;
  }
  .wordmark{font-family:var(--mono);font-size:14px;letter-spacing:.02em;white-space:nowrap}
  .wordmark b{font-weight:700}
  .wordmark span{color:var(--muted)}
  .grow{flex:1 1 auto}

  .find{position:relative;display:flex;align-items:center}
  .find input{
    font-family:var(--sans);font-size:14px;color:var(--ink);
    padding:5px 30px 5px 9px;width:230px;
    border:1px solid var(--rule);border-radius:0;background:#fff;
  }
  .find input:focus{outline:2px solid var(--mark);outline-offset:1px}
  .find .count{
    position:absolute;right:8px;font-family:var(--mono);font-size:11px;color:var(--muted);
    pointer-events:none;
  }
  .zoom{display:flex;border:1px solid var(--rule)}
  .zoom button{
    font-family:var(--mono);font-size:14px;line-height:1;
    min-width:30px;padding:0 8px;height:28px;
    border:0;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;
  }
  .zoom button + button{border-left:1px solid var(--rule)}
  .zoom button:hover{background:var(--sage)}
  .zoom button:active{background:var(--sage-deep)}
  .toggle{
    font-family:var(--mono);font-size:12px;height:28px;padding:0 10px;
    border:1px solid var(--rule);background:#fff;cursor:pointer;color:var(--ink);
  }
  .toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  /* ---------- body ---------- */
  main{flex:1 1 auto;display:flex;min-height:0;position:relative}

  /* exhibitor list */
  aside{
    flex:0 0 300px;border-right:1px solid var(--rule);background:#fff;
    display:flex;flex-direction:column;min-height:0;
  }
  aside.hidden{display:none}
  .panel-head{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 8px 7px 12px;border-bottom:1px solid var(--rule);background:var(--paper);
  }
  .panel-head h2{
    margin:0;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .panel-head .hide{
    flex:0 0 auto;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;
    font-family:var(--mono);font-size:12px;line-height:1;padding:6px 9px;
  }
  .panel-head .hide:hover{background:var(--sage)}
  .panel-head .hide:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
  aside ol{flex:1 1 auto;overflow-y:auto;list-style:none;margin:0;padding:0;-webkit-overflow-scrolling:touch}
  aside li{border-bottom:1px solid #e4e4e0}
  aside ol button{
    display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    padding:8px 12px;font:inherit;color:inherit;
  }
  aside ol button:hover,aside ol button:focus-visible{background:var(--sage);outline:none}
  aside .nm{font-size:14px;line-height:1.25}
  aside .lc{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
  aside li.on button{background:var(--sage-deep)}
  aside .none{padding:16px 12px;font-size:13px;color:var(--muted)}

  /* map viewport */
  #view{
    flex:1 1 auto;overflow:auto;position:relative;
    background:#f0f0ee;cursor:grab;overscroll-behavior:contain;
  }
  #view.dragging{cursor:grabbing}
  #stage{position:relative;transform-origin:0 0;line-height:0}
  #stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

  .hot{
    position:absolute;padding:0;margin:0;border:0;background:transparent;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .hot::after{
    content:"";position:absolute;inset:-1px;
    background:transparent;transition:background .08s linear;
  }
  .hot.hl::after{background:rgba(0,166,224,.34);box-shadow:inset 0 0 0 1px rgba(0,90,125,.85)}
  .hot.sel::after{background:rgba(0,166,224,.5);box-shadow:inset 0 0 0 2px #00506e}
  .hot.match::after{background:rgba(255,196,0,.42);box-shadow:inset 0 0 0 1px #8a6d00}
  .hot.match.hl::after,.hot.match.sel::after{background:rgba(0,166,224,.5)}
  .hot:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

  /* ---------- popover ---------- */
  #card{
    position:fixed;z-index:40;width:min(360px,calc(100vw - 24px));
    background:#fff;border:1px solid var(--rule);
    box-shadow:6px 6px 0 rgba(20,20,20,.16);
    display:none;line-height:1.45;
  }
  #card.open{display:block}
  #card .body{padding:14px 15px 12px}
  #card h2{margin:0 4px 0 0;font-size:17px;line-height:1.25;font-weight:600;display:inline}
  #card h2 a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--mark)}
  #card h2 a:hover{background:var(--mark);color:#fff}
  #card .title{margin:7px 0 0;font-size:14px;color:#2c2e29}
  #card .desc{margin:8px 0 0;font-size:13.5px;color:#33352f;max-height:34vh;overflow:auto}
  #card .meta{
    border-top:1px solid var(--rule);padding:7px 15px 8px;
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;
  }
  #card .meta .k{color:var(--ink)}
  #card .note{margin:8px 0 0;font-size:12.5px;color:var(--muted);font-style:italic}
  #card .x{
    position:absolute;top:0;right:0;width:30px;height:30px;border:0;background:none;
    font-family:var(--mono);font-size:16px;line-height:1;cursor:pointer;color:var(--muted);
  }
  #card .x:hover{color:var(--ink);background:var(--sage)}

  /* ---------- bottom bar ---------- */
  footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:7px 14px;border-top:1px solid var(--rule);background:var(--paper);
  }
  footer .links{display:flex;align-items:center;gap:9px}
  footer a{
    font-family:var(--mono);font-size:13px;color:var(--ink);white-space:nowrap;
    text-decoration:none;border-bottom:1px solid var(--mark);padding-bottom:1px;
  }
  footer a:hover{background:var(--mark);color:#fff;border-color:var(--mark)}
  footer a:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
  footer .sep{font-family:var(--mono);font-size:13px;color:#b6b6b0;user-select:none}
  #hint{margin:0;font-family:var(--mono);font-size:11px;color:var(--muted)}
  @media (max-width:760px){
    aside{position:absolute;z-index:30;inset:0 auto 0 0;width:82vw;flex-basis:82vw;
          box-shadow:4px 0 0 rgba(20,20,20,.12)}
    .panel-head{padding:9px 9px 9px 12px}
    .panel-head .hide{font-size:14px;padding:9px 13px}
    aside ol button{padding:11px 12px}
    #card{width:auto;overflow:auto}
    footer{padding:9px 12px}
    .find{flex:1 1 auto}
    .find input{width:100%}
    .wordmark span{display:none}
    #hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const W = DATA.w, H = DATA.h;

const view = document.getElementById('view');
const stage = document.getElementById('stage');
const plan = document.getElementById('plan');
const card = document.getElementById('card');

/* ---------- build hotspots ---------- */
const hotsByGroup = [];
const frag = document.createDocumentFragment();
DATA.groups.forEach(g => {
  const els = [];
  g.rects.forEach(r => {
    const b = document.createElement('button');
    b.className = 'hot';
    b.type = 'button';
    b.tabIndex = -1;
    b.style.left   = (r.x / W * 100) + '%';
    b.style.top    = (r.y / H * 100) + '%';
    b.style.width  = (r.w / W * 100) + '%';
    b.style.height = (r.h / H * 100) + '%';
    b.setAttribute('aria-label', g.name + ', table ' + r.id);
    b.dataset.g = g.g;
    b.addEventListener('mouseenter', () => hover(g.g, true));
    b.addEventListener('mouseleave', () => hover(g.g, false));
    b.addEventListener('click', e => { e.stopPropagation(); if (moved) return; select(g.g); });
    frag.appendChild(b);
    els.push(b);
  });
  hotsByGroup.push(els);
});
stage.appendChild(frag);

/* ---------- hover + selection ---------- */
let selected = null;
function hover(gi, on){
  if (gi === selected) return;
  hotsByGroup[gi].forEach(e => e.classList.toggle('hl', on));
}
function clearSel(){
  if (selected !== null) hotsByGroup[selected].forEach(e => e.classList.remove('sel','hl'));
  selected = null;
  card.classList.remove('open');
  document.querySelectorAll('#listBody li.on').forEach(li => li.classList.remove('on'));
}
function select(gi, opts){
  opts = opts || {};
  if (selected === gi && !opts.keep){ clearSel(); return; }
  clearSel();
  selected = gi;
  hotsByGroup[gi].forEach(e => e.classList.add('sel'));
  const li = document.querySelector('#listBody li[data-g="' + gi + '"]');
  if (li) { li.classList.add('on'); if (opts.scrollList) li.scrollIntoView({block:'nearest'}); }
  fillCard(DATA.groups[gi]);
  if (opts.center) centerOn(gi);
  placeCard(gi);
}

function fillCard(g){
  const nameEl = document.getElementById('cName');
  nameEl.textContent = '';
  if (g.url){
    const a = document.createElement('a');
    a.href = g.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = g.name;
    nameEl.appendChild(a);
  } else {
    nameEl.textContent = g.name;
  }
  const t = document.getElementById('cTitle');
  t.textContent = g.title || '';
  t.style.display = g.title ? '' : 'none';

  const d = document.getElementById('cDesc');
  d.textContent = g.desc || '';
  d.style.display = g.desc ? '' : 'none';

  const n = document.getElementById('cNote');
  let note = '';
  if (g.kind === 'maponly') note = 'Shown on the floor plan but not in the published exhibitor list.';
  if (g.kind === 'unassigned') note = 'No exhibitor assigned to this table yet.';
  n.textContent = note;
  n.style.display = note ? '' : 'none';

  const m = document.getElementById('cMeta');
  m.textContent = '';
  const add = (k, v) => {
    const s = document.createElement('span');
    s.innerHTML = '<span class="k">' + k + '</span> ';
    s.appendChild(document.createTextNode(v));
    m.appendChild(s);
  };
  if (g.eid) add('ID', g.eid);
  add('Location', g.locs.join(' / '));
  const removed = g.rects.filter(r => r.d).map(r => r.id);
  if (removed.length) add('Removed', removed.join(' / '));
}

/* The visual viewport is what the person can actually see. When the page is
   pinch-zoomed on a phone, it is a smaller window onto the layout viewport, and
   a position:fixed element pinned to "the bottom" lands off screen. Everything
   below positions against these numbers instead of innerWidth/innerHeight. */
function vport(){
  const vv = window.visualViewport;
  return vv
    ? {x: vv.offsetLeft, y: vv.offsetTop, w: vv.width, h: vv.height, s: vv.scale || 1}
    : {x: 0, y: 0, w: innerWidth, h: innerHeight, s: 1};
}

/* place the popover next to the group's tables, clamped to what's on screen */
function placeCard(gi){
  card.classList.add('open');
  const v = vport();

  if (innerWidth <= 760){                    // docked along the bottom of the view
    /* At page zoom s, a CSS pixel renders s times larger, so the card's text would
       balloon along with the map. Lay it out at screen size and scale it back down
       by 1/s, which keeps it physically the same card at any zoom level. */
    const pad = 8 / v.s;                     // 8 rendered px, in layout px
    card.style.transformOrigin = '0 0';
    card.style.transform = v.s === 1 ? '' : 'scale(' + (1 / v.s) + ')';
    card.style.right = 'auto';
    card.style.bottom = 'auto';
    card.style.width = Math.round(v.w * v.s - 16) + 'px';
    card.style.maxHeight = Math.round(v.h * v.s * 0.6) + 'px';
    card.style.left = Math.round(v.x + pad) + 'px';
    card.style.top = Math.round(v.y + v.h - card.offsetHeight / v.s - pad) + 'px';
    return;
  }

  card.style.width = '';                     // drop any sizing left by the docked layout
  card.style.maxHeight = '';
  card.style.transform = '';
  card.style.right = '';
  card.style.bottom = '';
  const rects = hotsByGroup[gi].map(e => e.getBoundingClientRect());
  const box = {
    l: Math.min(...rects.map(r => r.left)),
    r: Math.max(...rects.map(r => r.right)),
    t: Math.min(...rects.map(r => r.top)),
    b: Math.max(...rects.map(r => r.bottom))
  };
  const cw = card.offsetWidth, ch = card.offsetHeight, pad = 10;
  const minX = v.x + pad, maxX = v.x + v.w - cw - pad;
  const minY = Math.max(v.y + pad, 58), maxY = v.y + v.h - ch - pad;
  let x = box.r + pad;
  if (x > maxX) x = box.l - cw - pad;
  if (x < minX) x = Math.min(Math.max(minX, box.l), maxX);
  let y = Math.min(Math.max(box.t, minY), Math.max(minY, maxY));
  card.style.left = Math.round(x) + 'px';
  card.style.top  = Math.round(y) + 'px';
}

if (window.visualViewport){
  let pending = false;
  const follow = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; if (selected !== null) placeCard(selected); });
  };
  visualViewport.addEventListener('resize', follow);
  visualViewport.addEventListener('scroll', follow);
}

document.getElementById('cardX').addEventListener('click', clearSel);
view.addEventListener('click', () => { if (!moved) clearSel(); });
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (card.classList.contains('open')){ clearSel(); return; }
  if (!aside.classList.contains('hidden')){ setList(false, true); return; }
  document.getElementById('q').blur();
});

/* ---------- zoom & pan ---------- */
let zoom = 1, fitZoom = 1;
function applyZoom(z, ax, ay){
  const old = zoom;
  zoom = Math.min(8, Math.max(fitZoom * 0.9, z));
  const cx = (view.scrollLeft + (ax ?? view.clientWidth / 2)) / old;
  const cy = (view.scrollTop  + (ay ?? view.clientHeight / 2)) / old;
  stage.style.width = (baseW * zoom) + 'px';
  view.scrollLeft = cx * zoom - (ax ?? view.clientWidth / 2);
  view.scrollTop  = cy * zoom - (ay ?? view.clientHeight / 2);
  if (selected !== null) placeCard(selected);
}
let baseW = 0;
function measure(){
  baseW = view.clientWidth || 1;
  fitZoom = Math.min(1, view.clientHeight / (baseW * H / W));
}
function init(){
  measure();
  applyZoom(1);                       // open at full width: tables are legible, scroll to explore
  view.scrollTop = 0;
}
plan.addEventListener('load', init);
if (plan.complete) init();
function reflow(){
  const rel = zoom;
  measure();
  applyZoom(rel);
}
addEventListener('resize', reflow);

document.getElementById('zin').onclick  = () => applyZoom(zoom * 1.5);
document.getElementById('zout').onclick = () => applyZoom(zoom / 1.5);
document.getElementById('zfit').onclick = () => { clearSel(); applyZoom(fitZoom); };

view.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const r = view.getBoundingClientRect();
  applyZoom(zoom * (e.deltaY < 0 ? 1.12 : 1/1.12), e.clientX - r.left, e.clientY - r.top);
}, {passive:false});

/* drag to pan; a drag must not also count as a click */
let drag = null, moved = false;
const pointers = new Map();
let pinch = null;

view.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), z: zoom};
    drag = null;
    return;
  }
  moved = false;
  drag = {x:e.clientX, y:e.clientY, sl:view.scrollLeft, st:view.scrollTop};
  view.classList.add('dragging');
});
addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const r = view.getBoundingClientRect();
    applyZoom(pinch.z * (d / pinch.d), (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
    moved = true;
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
  view.scrollLeft = drag.sl - dx;
  view.scrollTop  = drag.st - dy;
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  drag = null;
  view.classList.remove('dragging');
}
addEventListener('pointerup', endPointer);
addEventListener('pointercancel', endPointer);
view.addEventListener('scroll', () => { if (selected !== null) placeCard(selected); });

function centerOn(gi){
  const r = DATA.groups[gi].rects;
  const cx = (Math.min(...r.map(t=>t.x)) + Math.max(...r.map(t=>t.x+t.w))) / 2 / W;
  const cy = (Math.min(...r.map(t=>t.y)) + Math.max(...r.map(t=>t.y+t.h))) / 2 / H;
  // zoom in far enough that table numbers are actually readable, phone or laptop
  const want = Math.min(8, Math.max(zoom, 2800 / baseW));
  if (want > zoom) { zoom = want; stage.style.width = (baseW * zoom) + 'px'; }
  // aim for the middle of what's visible, which is not the middle of the page
  // when it's pinch-zoomed
  const v = vport(), vr = view.getBoundingClientRect();
  const yFrac = innerWidth <= 760 ? 0.3 : 0.5;   // sit above the docked card on phones
  view.scrollLeft = cx * baseW * zoom - (v.x + v.w / 2 - vr.left);
  view.scrollTop  = cy * baseW * zoom * (H/W) - (v.y + v.h * yFrac - vr.top);
}

/* ---------- exhibitor list ---------- */
const listBody = document.getElementById('listBody');
const listable = DATA.groups
  .filter(g => g.kind === 'listed' || g.kind === 'maponly')
  .sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
function renderList(items){
  listBody.textContent = '';
  if (!items.length){
    const p = document.createElement('div');
    p.className = 'none';
    p.textContent = 'Nothing matches that. Try a table number like C221, or part of a name.';
    listBody.appendChild(p);
    return;
  }
  const f = document.createDocumentFragment();
  items.forEach(g => {
    const li = document.createElement('li');
    li.dataset.g = g.g;
    const b = document.createElement('button');
    b.innerHTML = '<div class="nm"></div><div class="lc"></div>';
    b.querySelector('.nm').textContent = g.name;
    b.querySelector('.lc').textContent = g.locs.join(' / ');
    b.addEventListener('click', () => {
      if (innerWidth <= 760) setList(false);   // get the panel out of the way of the map
      select(g.g, {center:true, keep:true});
    });
    b.addEventListener('mouseenter', () => hover(g.g, true));
    b.addEventListener('mouseleave', () => hover(g.g, false));
    li.appendChild(b);
    f.appendChild(li);
  });
  listBody.appendChild(f);
}
renderList(listable);

const listBtn = document.getElementById('listBtn');
const listX = document.getElementById('listX');
const listHead = document.getElementById('listHead');
const aside = document.getElementById('list');

function listOpen(){ return !aside.classList.contains('hidden'); }
function setList(open, focusBack){
  if (listOpen() === open) return;
  aside.classList.toggle('hidden', !open);
  listBtn.setAttribute('aria-pressed', open);
  if (focusBack) listBtn.focus();
  reflow();
}
listBtn.addEventListener('click', () => setList(!listOpen()));
listX.addEventListener('click', () => setList(false, true));
function fitKeep(){ reflow(); }

/* ---------- search ---------- */
const q = document.getElementById('q');
let lastHits = [];
const qn = document.getElementById('qn');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  document.querySelectorAll('.hot.match').forEach(e => e.classList.remove('match'));
  if (!s){
    qn.textContent = ''; lastHits = [];
    listHead.textContent = 'All exhibitors';
    renderList(listable); return;
  }
  const score = g => {
    const n = g.name.toLowerCase();
    if (g.locs.some(l => l.toLowerCase() === s)) return 0;   // exact table number
    if (n === s) return 1;
    if (n.startsWith(s)) return 2;
    if (n.includes(s)) return 3;
    if (g.locs.some(l => l.toLowerCase().includes(s))) return 4;
    const t = (g.title||'').toLowerCase();
    if (t === s || t.startsWith(s)) return 5;
    if (t.includes(s)) return 6;
    if ((g.desc||'').toLowerCase().includes(s)) return 7;
    return 99;
  };
  const hits = DATA.groups.map(g => [score(g), g]).filter(p => p[0] < 99);
  hits.sort((a,b) => a[0] - b[0] ||
    a[1].name.toLowerCase().localeCompare(b[1].name.toLowerCase()));
  const ordered = hits.map(p => p[1]);
  ordered.forEach(g => hotsByGroup[g.g].forEach(e => e.classList.add('match')));
  qn.textContent = ordered.length;
  renderList(ordered);
  lastHits = ordered;
  listHead.textContent = ordered.length
    ? ordered.length + (ordered.length === 1 ? ' match for ' : ' matches for ') + '"' + q.value.trim() + '"'
    : 'No matches';
  setList(true);
});
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  q.blur();                                  // drop the phone keyboard
  if (innerWidth <= 760) setList(false);
  const first = listBody.querySelector('li');
  if (first) { select(+first.dataset.g, {center:true, scrollList:true, keep:true}); return; }
  if (lastHits.length) select(lastHits[0].g, {center:true, keep:true});
});
